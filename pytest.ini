[pytest]
minversion = 8.0
addopts = -ra --strict-markers --strict-config
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: isolated unit tests for individual modules
    api: HTTP API tests using FastAPI TestClient
    websocket: WebSocket signaling and connection lifecycle tests
    integration: tests spanning multiple application components
